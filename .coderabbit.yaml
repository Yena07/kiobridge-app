language: "ko-KR"

reviews:
  # 팀 저장소는 chill 이라 조용하다. 여기는 개인 저장소이고 아무도 방해받지 않으므로
  # 최대한 많이 잡아내게 둔다. 다 고칠 필요는 없고, 골라 쓰면 된다.
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    # 리뷰 전용 baseline 브랜치를 base 로 쓰는 PR 도 자동 리뷰 대상에 넣는다.
    # 이게 없으면 기본 브랜치가 아닌 base 는 건너뛴다.
    base_branches:
      - "master"
      - "review/.*"

  path_filters:
    - "!**/dist/**"
    - "!**/node_modules/**"
    - "!package-lock.json"
    # Figma Make 가 남긴 메타 파일들. 우리가 쓰는 코드가 아니다.
    - "!make_binary_files.json"
    - "!meta.json"
    - "!default_shadcn_theme.css"

  path_instructions:
    - path: "src/**"
      instructions: |
        키오스크 앞에서 막히는 고령·디지털 취약 사용자를 대신해 키오스크를 조작해 주는 앱입니다.
        해커톤 심사 대상이고, 아래 항목은 어기면 실격입니다. 특히 꼼꼼히 봐 주세요.

        [실격 조건]
        - 결제 관련 UI(결제 버튼, 결제수단 선택 화면)가 어디에도 없어야 합니다.
          종료 상태는 "장바구니에 담았어요"까지이며, "주문 완료" 같은 표현도 쓰면 안 됩니다.
        - select_payment / confirm_payment / submit_payment / complete_payment /
          open_payment_method 문자열은 실행되지 않더라도 코드에 존재하기만 해도 위반입니다.
        - 사용자가 승인 버튼을 누르기 전에 실행 계획 생성·실행 API 를 호출하는 코드 경로가
          아예 없어야 합니다. "호출하지 않는다"가 아니라 "호출할 길이 없다"여야 합니다.
        - 키오스크 상품 ID 나 화면 좌표를 앱이 들고 있거나 저장하면 안 됩니다.
          사람이 읽는 의미값(텍스트)만 씁니다.
        - 병원 관련 화면에 증상·진단·치료·통증 등 의료적 판단으로 읽힐 표현이 있으면 안 됩니다.
          접수와 안내 절차만 다룹니다.
        - 관공서 관련 화면이 이용자격이나 법적 수급 가능성을 판단하면 안 됩니다.
          업무 선택과 절차 안내만 합니다.
        - 실제 개인정보(이름·전화번호·주소·주민번호·환자번호)를 받거나 저장하면 안 됩니다.
          가상·합성 데이터만 씁니다.
        - 알레르기·품절·이용 불가 후보는 점수를 깎는 게 아니라 후보에서 완전히 제거해야 합니다.
        - 아이콘은 선 아이콘(Pictogram)을 씁니다. 이모지는 위트 액센트 한 곳까지만
          허용합니다 - 기기마다 모양이 다르고 스크린리더가 이름을 읽어 주므로,
          뜻을 지고 있는 자리(상태 표시.버튼.레이블)에는 쓰지 않습니다.

        [접근성 — 심사에서 사람이 직접 확인하는 항목]
        - 로그인하지 않아도 추천부터 최종 확인까지 전 과정이 동작하는지.
        - 키보드만으로 전체 흐름을 조작할 수 있는지.
        - 화면 확대 200% 에서 잘리거나 닿지 못하는 조작 요소가 없는지.
        - 색상 없이도 상태를 알 수 있는지(픽토그램·텍스트 병행).
        - 터치 영역이 최소 44x44 인지.
        - 글자 대비가 WCAG AA(본문 4.5:1, 큰 글씨 3:1, 컨트롤 경계 3:1)를 넘는지.

        [이 앱이 지켜야 하는 약속]
        - 화면이 "당신이 고른 조건을 이렇게 썼습니다"라고 말할 때, 사용자가 실제로 고르지 않은
          조건이 섞이면 안 됩니다. 대신 눌러 주는 앱에서 가장 나쁜 결함입니다.
        - 못 맞춘 조건이 있으면 감추지 말고 사용자에게 알려야 합니다.
        - '이 기기에서 정보 지우기'처럼 화면이 약속한 동작은 실제로 그대로 일어나야 합니다.

    - path: "src/app/App.tsx"
      instructions: |
        2,000줄이 넘는 단일 파일입니다. 화면 컴포넌트가 한곳에 모여 있습니다.
        - 상태 관리에서 실제로 버그가 될 수 있는 곳(경쟁 상태, 정리 안 된 타이머·구독,
          stale closure, 중복 실행)을 우선 지적해 주세요.
        - 파일을 쪼개라는 일반론적 제안은 이미 알고 있으니 반복하지 않아도 됩니다.
          쪼갠다면 어디가 실제 경계인지 구체적으로 짚어 주면 도움이 됩니다.

    - path: "src/api/**"
      instructions: |
        백엔드가 붙기 전까지 화면을 구동하는 목 구현입니다.
        client.ts 의 api 를 실제 구현으로 바꾸면 화면 코드는 건드리지 않고 교체됩니다.
        - 목이 프로필과 무관하게 고정 응답을 돌려주는 경로가 남아 있는지 확인해 주세요.
        - 승인 조건(후보 선택·변경 확인·저확신 확인)을 프론트 가드뿐 아니라
          이 계층에서도 다시 검사하는지 봐 주세요.

chat:
  auto_reply: true
